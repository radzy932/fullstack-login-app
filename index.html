<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AuthFlow | Login & Signup</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <div class="container">

    <div class="left-section">

      <h1>AuthFlow</h1>

      <p>
        Secure Authentication System
        built using Node.js,
        Express.js, JWT & bcrypt.
      </p>

    </div>

    <div class="right-section">

      <div class="card">

        <div class="tabs">

          <button
            class="tab active"
            onclick="showSignup()"
            id="signupTab"
          >
            Signup
          </button>

          <button
            class="tab"
            onclick="showLogin()"
            id="loginTab"
          >
            Login
          </button>

        </div>

        <div id="signupForm">

          <h2>Create Account</h2>

          <input
            type="text"
            id="signupName"
            placeholder="Full Name"
          />

          <input
            type="email"
            id="signupEmail"
            placeholder="Email Address"
          />

          <input
            type="password"
            id="signupPassword"
            placeholder="Password"
          />

          <button
            class="primary-btn"
            onclick="signup()"
          >
            Create Account
          </button>

        </div>

        <div
          id="loginForm"
          style="display:none;"
        >

          <h2>Welcome Back</h2>

          <input
            type="email"
            id="loginEmail"
            placeholder="Email Address"
          />

          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
          />

          <button
            class="primary-btn"
            onclick="login()"
          >
            Login
          </button>

        </div>

      </div>

    </div>

  </div>

<script>

function showSignup() {

  document.getElementById(
    "signupForm"
  ).style.display = "block";

  document.getElementById(
    "loginForm"
  ).style.display = "none";

  document.getElementById(
    "signupTab"
  ).classList.add("active");

  document.getElementById(
    "loginTab"
  ).classList.remove("active");
}

function showLogin() {

  document.getElementById(
    "signupForm"
  ).style.display = "none";

  document.getElementById(
    "loginForm"
  ).style.display = "block";

  document.getElementById(
    "loginTab"
  ).classList.add("active");

  document.getElementById(
    "signupTab"
  ).classList.remove("active");
}

async function signup() {

  const res = await fetch(
    "/api/signup",
    {
      method: "POST",
      headers: {
        "Content-Type":
          "application/json",
      },
      body: JSON.stringify({
        name:
          document.getElementById(
            "signupName"
          ).value,

        email:
          document.getElementById(
            "signupEmail"
          ).value,

        password:
          document.getElementById(
            "signupPassword"
          ).value,
      }),
    }
  );

  const data = await res.json();

  alert(data.message);
}

async function login() {

  const res = await fetch(
    "/api/login",
    {
      method: "POST",
      headers: {
        "Content-Type":
          "application/json",
      },
      body: JSON.stringify({
        email:
          document.getElementById(
            "loginEmail"
          ).value,

        password:
          document.getElementById(
            "loginPassword"
          ).value,
      }),
    }
  );

  const data = await res.json();

  if (data.token) {
    localStorage.setItem(
      "token",
      data.token
    );
  }

  alert(data.message);
}

</script>

</body>
</html>
